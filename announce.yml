name: Wednesday Food Announcement

on:
  schedule:
    - cron: '30 22 * * 3'  # Every Wednesday 22:30 UTC = 5:30 PM Winnipeg CDT (summer) / 4:30 PM CST (winter)
  workflow_dispatch:        # Lets you test it manually anytime

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Send Telegram announcement
        run: python send_announcement.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}